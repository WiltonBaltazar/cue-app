server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 5m;
    server_tokens off;

    # Errors go to the container log; PHP-FPM already logs each request.
    error_log /dev/stderr warn;
    access_log off;

    # Compressed responses roughly halve load time on a 3G phone.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The service worker and manifest must never be cached, or updates stall on phones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /build/manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Other built assets carry a content hash in their name.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Debian's params send $host, which drops the port and breaks asset URLs off :80/:443.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        # Laravel's encrypted cookies and security headers outgrow the 4 KB default (502).
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
