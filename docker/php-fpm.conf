; Pool overrides for the Cue App image (~100–200 volunteers, a few coordinators).
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
